spring.application.name=backend
server.port=8080

# ========================================================
# Cau hinh Spring AI voi Ollama Local (Mien phi, khong can API key)
# ========================================================
# Dia chi Ollama local (mac dinh chay tren cong 11434)
spring.ai.ollama.base-url=http://localhost:11434

# Tat hoan toan Chat Model vi ung dung chi can Embedding Model
spring.ai.model.chat=none
spring.ai.ollama.chat.enabled=false

# Cau hinh Embedding Model
spring.ai.model.embedding=ollama
spring.ai.ollama.embedding.enabled=true
spring.ai.ollama.embedding.options.model=nomic-embed-text

# ========================================================
# Cau hinh Vector Store & Ung dung
# ========================================================
# File JSON luu vector store offline
app.vector-store.file-path=data/vector-store.json

# CORS cho phep frontend Vite
app.cors.allowed-origin=http://localhost:5173

# Swagger UI & OpenAPI Docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

logging.level.iuh.fit.backend=DEBUG
